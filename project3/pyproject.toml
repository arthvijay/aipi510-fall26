[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ridecast"
version = "0.1.0"
description = "Bike-share demand planning dashboard"
requires-python = ">=3.11,<3.13"
dependencies = [
  "numpy==1.26.4", "pandas==2.2.3", "scikit-learn==1.5.2",
  "PyYAML==6.0.2", "joblib==1.4.2", "requests==2.32.3",
  "fastapi==0.115.6", "uvicorn[standard]==0.34.0",
  "google-cloud-storage==2.19.0", "mlflow==2.19.0",
  "SQLAlchemy==2.0.36",
]

[project.scripts]
ridecast = "ridecast.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]

